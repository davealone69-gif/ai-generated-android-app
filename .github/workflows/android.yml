name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

  publish-latest-apk:
    name: Publish latest APK download
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug.apk
          path: release-apk
      - name: Stage direct APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release-apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p release-assets
          cp "$apk" release-assets/latest-debug.apk
      - name: Publish latest debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}-${{ github.run_attempt }}
          name: Latest Android debug build #${{ github.run_number }}
          body: |
            Automated debug/test APK from commit ${{ github.sha }}.
            This is not a production-signed release.
          files: release-assets/latest-debug.apk
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
